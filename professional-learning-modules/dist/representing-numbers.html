<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Representing Numbers K–6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2333; --ink2:#4a5468; --ink3:#6d778a; --line:#e2e5ec; --bg:#f6f7fa; --card:#ffffff;
  --navy:#1f2a44; --accent:#c8553d; --accent-soft:#fbeee9;
  --es1:#d1603d; --es1-soft:#fcece6;
  --s1:#c88a12; --s1-soft:#fbf3e1;
  --s2:#23897d; --s2-soft:#e3f3f1;
  --s3:#4b5bbf; --s3-soft:#e9ebf8;
  --good:#2e7d4f; --good-soft:#e6f4ec; --bad:#b3372a; --bad-soft:#fbe9e7;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
h1,h2,h3,h4{line-height:1.25;margin:0}
p{margin:0 0 12px}
a{color:var(--s3)}

/* ---------- header ---------- */
.top{background:var(--navy);color:#fff;padding:18px 24px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.top .brand{flex:1 1 320px}
.top .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
.top h1{font-size:24px;font-weight:800;margin-top:2px}
.prog{flex:0 1 260px;min-width:200px}
.prog .lab{font-size:13px;opacity:.85;display:flex;justify-content:space-between}
.prog .bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin-top:6px}
.prog .fill{height:100%;background:#f2b33d;width:0;transition:width .4s}

/* ---------- layout ---------- */
.wrap{display:flex;min-height:calc(100vh - 80px);background:linear-gradient(to right,#fff 236px,var(--bg) 236px)}
@media (max-width:820px){.wrap{background:var(--bg)}}
nav.side{flex:0 0 236px;background:#fff;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:auto}
nav.side .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:14px 10px 6px}
nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--ink2);font-size:14.5px;font-weight:500}
nav.side button:hover{background:var(--bg)}
nav.side button.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
nav.side .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
nav.side .dot.done{background:var(--good);border-color:var(--good)}
nav.side .dot.done::after{content:"✓"}
.mobnav{display:none}
main{flex:1;min-width:0;padding:28px 32px 60px}
.page{max-width:900px;margin:0 auto}

@media (max-width:820px){
  nav.side{display:none}
  .mobnav{display:block;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .mobnav select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);font-family:inherit;font-size:15px;background:#fff}
  main{padding:20px 16px 48px}
  .top{padding:16px}
  .top h1{font-size:20px}
}

/* ---------- common blocks ---------- */
.hero{border-radius:var(--r);padding:22px 24px;margin-bottom:22px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--accent)}
.hero .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.hero h2{font-size:26px;font-weight:800;margin-bottom:8px}
.hero p{color:var(--ink2);font-size:16.5px;margin:0}
section.blk{margin:26px 0}
section.blk>h3{font-size:19px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
section.blk>h3 .n{font-size:12px;font-weight:700;background:var(--navy);color:#fff;border-radius:6px;padding:2px 8px}
.lead{color:var(--ink2);margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.src-nesa{background:#eef2fb;color:#34408a;border-color:#d5dcf2}
.src-add{background:#fff6e6;color:#8a5a00;border-color:#f2deb4}
.src-dio{background:#eaf5ff;color:#0b5a8f;border-color:#c5e1f5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:14px}
.note{font-size:14px;color:var(--ink3)}
.btn{border:0;background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.done-bar{margin-top:36px;padding:18px 20px;border-radius:var(--r);background:#fff;border:1px dashed #c9ced9;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.done-bar.is-done{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.nextprev{display:flex;flex-wrap:wrap;gap:10px}
.tool select{max-width:100%}
ul.tight{margin:0;padding-left:20px}
ul.tight li{margin:4px 0}

/* outcomes */
.outc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.outc code{font-family:inherit;font-weight:700;font-size:13px;padding:3px 8px;border-radius:6px;white-space:nowrap;color:#fff}

/* accordion */
.acc{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:0;background:#fff;padding:13px 16px;font-weight:600;color:var(--ink)}
.acc>button .ch{transition:transform .2s;color:var(--ink3);flex:0 0 auto}
.acc.open>button .ch{transform:rotate(90deg)}
.acc .body{display:none;padding:0 16px 14px 16px;color:var(--ink2)}
.acc.open .body{display:block}
.acc .part{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-right:8px;color:#fff;vertical-align:1px}

/* knowledge cards */
.kcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-top:4px solid var(--line)}
.kcard h4{font-size:16px;margin-bottom:6px}
.kcard p{color:var(--ink2);font-size:15px;margin:0}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.flip{perspective:1200px;min-height:196px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:196px;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;overflow:auto}
.flip .f{background:#fff;border:1px solid var(--line)}
.flip .b{background:var(--navy);color:#fff;transform:rotateY(180deg)}
.flip .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.7;margin-bottom:6px}
.flip .f .say{font-size:16.5px;font-weight:600;flex:1;color:var(--ink)}
.flip .f .hint{font-size:13px;color:var(--ink3);margin-top:10px}
.flip .b h4{font-size:16px;margin-bottom:8px}
.flip .b p{font-size:14px;margin:0 0 8px;opacity:.92}
.flip .b .pill{align-self:flex-start;margin-top:auto}

/* working mathematically */
.wmel{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.wmel div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.wmel b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.wtag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:#eef2fb;color:#34408a;white-space:nowrap}
.tagrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px}
.tagrow:first-child{border-top:0}
.tagrow .sl{font-weight:700;font-size:12.5px;padding:3px 8px;border-radius:6px;color:#fff;text-align:center}
@media (max-width:620px){.tagrow{grid-template-columns:1fr}.tagrow .sl{justify-self:start}}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.mk{grid-template-columns:1fr}}
.mk .side{border-radius:var(--r);padding:18px 20px;border:2px solid}
.mk .before{background:#fdf6f5;border-color:#efc9c3}
.mk .after{background:#f2faf6;border-color:#a9d9bf}
.mk .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;margin-bottom:10px}
.mk .before .lbl{color:var(--bad)}
.mk .after .lbl{color:var(--good)}
.mk .task{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px 16px;font-size:15.5px;margin-bottom:12px}
.mk .task.closed{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px}
.mk ul{margin:0;padding-left:20px;font-size:14.5px;color:var(--ink2)}
.mk ul li{margin:3px 0}
.mk .hidden-after{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:220px;color:var(--ink2)}
.mk .think{font-size:15px;max-width:320px}
.mk .think textarea{width:100%;min-height:70px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14.5px}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.diff div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--ink2)}
.diff b{display:block;color:var(--ink);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.wmchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.wmchips span{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--good-soft);color:#1d5236;border:1px solid #bfe3cd}
.moves{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.moves button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.moves button.on{background:var(--good);border-color:var(--good);color:#fff}

/* quiz */
.quiz .q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px}
.quiz .q h4{font-size:16px;margin-bottom:12px;font-weight:600}
.quiz .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;margin-bottom:8px;color:var(--ink)}
.quiz .opt:hover:not(:disabled){border-color:#aab2c3}
.quiz .opt.right{border-color:var(--good);background:var(--good-soft)}
.quiz .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz .opt:disabled{cursor:default}
.quiz .fb{display:none;margin-top:6px;padding:10px 14px;border-radius:9px;font-size:15px}
.quiz .fb.show{display:block}
.quiz .fb.ok{background:var(--good-soft);color:#1d5236}
.quiz .fb.no{background:var(--bad-soft);color:#7a2219}

/* quick check */
.qc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.qc ol{margin:0;padding-left:22px}
.qc li{margin:8px 0;color:var(--ink2)}
.qc li b{color:var(--ink)}

/* tool box */
.tool{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.tool .tt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin-bottom:4px}
.tool h4{font-size:18px;margin-bottom:6px}
.tool .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.tool select,.tool input[type=number]{font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tool input[type=number]{width:90px}
.fbline{margin-top:12px;padding:10px 14px;border-radius:9px;font-size:15px;display:none}
.fbline.show{display:block}
.fbline.ok{background:var(--good-soft);color:#1d5236}
.fbline.no{background:var(--bad-soft);color:#7a2219}
.fbline.info{background:var(--bg);color:var(--ink2)}

/* shared */
.readout{font-size:20px;font-weight:700;margin-top:14px}
.readout small{display:block;font-size:14px;font-weight:500;color:var(--ink3);margin-top:2px}

/* progression explorer */
.aspects{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.aspects button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.aspects button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pcols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.pcol{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pcol .ph{padding:10px 14px;color:#fff;font-weight:700}
.pcol .ph small{display:block;font-weight:500;opacity:.85;font-size:12.5px}
.pcol .pb{padding:12px 14px;font-size:14.5px;color:var(--ink2);flex:1}
.pcol .pb b{color:var(--ink)}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.shift{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--ink2)}
.shift .arr{font-weight:700;color:var(--ink);font-size:13px;margin-bottom:4px}
@media (max-width:820px){.pcols{grid-template-columns:1fr 1fr}.shifts{grid-template-columns:1fr}}
@media (max-width:480px){.pcols{grid-template-columns:1fr}}

/* big ideas */
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.idea{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;color:var(--ink);transition:box-shadow .2s,border-color .2s}
.idea:hover{border-color:#b9c0cf;box-shadow:0 4px 14px rgba(20,30,60,.06)}
.idea .num{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.idea h4{font-size:17px;margin:8px 0 6px}
.idea p{font-size:14.5px;color:var(--ink2);margin:0}
.idea.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.ideadetail{margin-top:14px}
.srow{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.srow:first-of-type{border-top:0}
.srow .sl{font-weight:700;font-size:13px;padding:3px 8px;border-radius:6px;color:#fff;align-self:start;text-align:center}

/* models grid */
.mgrid{display:grid;grid-template-columns:minmax(170px,1.3fr) repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mgrid .mh{padding:10px 8px;font-weight:700;font-size:13px;text-align:center;border-bottom:1px solid var(--line);color:#fff}
.mgrid .mh.first{text-align:left;color:var(--ink);background:#fff;padding-left:14px}
.mrow{display:contents}
.mrow>.mn{grid-column:1;padding:9px 14px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.mrow>.mn small{display:block;font-weight:400;color:var(--ink3);font-size:12.5px}
.mrow .mc{border-top:1px solid var(--line);border-left:1px solid var(--line);position:relative}
.mbar{position:relative;z-index:1;align-self:center;height:18px;border-radius:9px;margin:0 8px;cursor:pointer}
.mrow.sel>.mn{background:var(--accent-soft)}
.mdetail{margin-top:14px}
@media (max-width:620px){.mgrid{grid-template-columns:minmax(120px,1.4fr) repeat(4,1fr)}.mgrid .mh{font-size:11px;padding:8px 2px}}

/* sorter */
.sorter .scn{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.sorter .quote{font-size:19px;font-weight:600;border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:8px 0 18px}
.roots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roots button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;font-weight:600;color:var(--ink)}
.roots button:hover:not(:disabled){border-color:#9aa3b5}
.roots button.right{border-color:var(--good);background:var(--good-soft)}
.roots button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.roots button:disabled{cursor:default}
@media (max-width:560px){.roots{grid-template-columns:1fr}}
.score{font-size:14px;color:var(--ink3)}

/* reflection */
.rq{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.rq label{font-weight:600;display:block;margin-bottom:8px}
.rq textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:15px;resize:vertical}
.rq textarea:focus{outline:2px solid var(--s3);border-color:transparent}
.todo label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.todo label:first-child{border-top:0}
.todo input{margin-top:5px;width:17px;height:17px;accent-color:var(--good)}
.saved{font-size:13px;color:var(--good);margin-left:8px}

table.simple{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:15px}
table.simple th,table.simple td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.simple th{background:var(--bg);font-size:13px;color:var(--ink2);border-top:0}
footer{font-size:13px;color:var(--ink3);text-align:center;padding:20px 16px 30px;border-top:1px solid var(--line);background:#fff}
:focus-visible{outline:3px solid #f2b33d;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* knowledge and confidence check */
.chk{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;border-top:4px solid var(--accent)}
.chk h3{margin:8px 0 6px}
.chktime{font-size:13px;font-weight:600;color:var(--ink3);margin-left:4px}
.chkq{margin-top:16px}
.chkq select,.chkq textarea{display:block;margin-top:6px;max-width:100%;font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.chkq textarea{width:100%;min-height:70px}
.chkrate{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.chkrate>span:first-child{flex:1;min-width:220px}
.chkopts{display:flex;gap:6px}
.chkopts label,.chkmc label{cursor:pointer}
.chkopts input,.chkmc input{position:absolute;opacity:0;pointer-events:none}
.chkopts span{display:inline-block;width:38px;height:38px;line-height:36px;text-align:center;border:1.5px solid var(--line);border-radius:50%;font-weight:700;color:var(--ink2);background:#fff}
.chkopts input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.chkopts input:focus-visible+span,.chkmc input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chkmc{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chkmc span{display:block;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;font-size:15px}
.chkmc input:checked+span{border-color:var(--navy);background:#eef0f7;font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;font:inherit;cursor:pointer}
.chkres{margin-top:12px}
.chkres h4{margin:0 0 8px}
.chkres table{margin-bottom:10px}

<style>
/* ES1 cards */
.ncards{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ncard{width:40px;height:52px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:18px;background:#fff;transition:all .3s}
.ncard.cov{background:var(--es1);border-color:var(--es1);color:transparent}

/* S1 blocks */
.blocks{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:12px;min-height:70px}
.bgrp{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;max-width:100%}
.hund{width:48px;height:48px;border:1px solid #a77300;background-color:#f6c453;background-image:linear-gradient(#a77300 1px,transparent 1px),linear-gradient(90deg,#a77300 1px,transparent 1px);background-size:4.6px 4.6px;background-position:-1px -1px}
.ten{width:8px;height:48px;background:repeating-linear-gradient(0deg,#f6c453 0 4.4px,#a77300 4.4px 4.8px);border:1px solid #a77300}
.one{width:8px;height:8px;background:#f6c453;border:1px solid #a77300}

/* S2 number line */
.nl{margin-top:14px}
.nl svg{width:100%;height:auto;display:block}
.pair{display:flex;gap:12px;flex-wrap:wrap}
.pair .btn{min-width:110px;font-size:20px;padding:12px 22px;background:var(--s2)}

/* S3 number slide */
.slide{margin-top:12px;overflow-x:auto}
.slide .frame{position:relative;display:grid;grid-template-columns:repeat(7,72px);width:504px;margin:0 auto}
.slide .hd{font-size:11px;text-align:center;color:var(--ink3);font-weight:600;padding:4px 2px;height:34px;line-height:1.2}
.slide .cells{position:relative;grid-column:1/-1;display:grid;grid-template-columns:repeat(7,72px);height:72px;border:2px solid var(--navy);border-radius:10px;background:#fff;overflow:hidden}
.slide .cell{border-right:1px solid var(--line);display:grid;place-items:center;font-size:30px;font-weight:700;color:#c3c8d3}
.slide .cell:last-child{border-right:0}
.slide .cell.ones{background:var(--s3-soft)}
.slide .strip{position:absolute;top:0;left:0;height:100%;display:flex;transition:transform .6s cubic-bezier(.5,0,.2,1)}
.slide .strip span{width:72px;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--s3)}
.slide .pt{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);left:288px;z-index:3;box-shadow:0 0 0 3px #fff}

</style>

<script>
function toolHTML(t){
 if(t==="cards") return '<div class="tool"><div class="tt">Quick check simulator</div><h4>Covered cards</h4><p class="note">Some cards from 1 to 20 are covered. How many? Try reasoning from the first card you can see, as a student with secure understanding would, rather than counting.</p><div class="ncards" id="ncards"></div><div class="ctrl"><label for="covAns">How many are covered?</label><input type="number" id="covAns" min="0" max="20"><button class="btn small" id="covCheck">Check</button><button class="btn ghost small" id="covNew">New cards</button></div><div class="fbline" id="covFb"></div></div>';
 if(t==="blocks") return '<div class="tool"><div class="tt">Model</div><h4>Rename a three-digit number</h4><p class="note">Trade a hundred for ten tens, or a ten for ten ones. The number stays the same, but its name changes.</p><div class="ctrl"><label for="blkNum">Number</label><select id="blkNum"><option>326</option><option>107</option><option>240</option><option>583</option></select><button class="btn ghost small" id="bH">1 hundred → 10 tens</button><button class="btn ghost small" id="bT">1 ten → 10 ones</button><button class="btn ghost small" id="bT2">10 tens → 1 hundred</button><button class="btn ghost small" id="bO2">10 ones → 1 ten</button></div><div class="blocks" id="blocks"></div><div class="readout" id="blkRead"></div></div>';
 if(t==="decimals") return '<div class="tool"><div class="tt">Diagnostic</div><h4>Which is larger?</h4><p class="note">Each pair is built around a decimal misconception from the NESA advice. Choose the larger number, then see both on a number line.</p><div class="score" id="decScore"></div><div class="pair" id="decPair" style="margin-top:10px"></div><div class="nl" id="decLine"></div><div class="fbline" id="decFb"></div><div class="ctrl"><button class="btn ghost small" id="decNext" disabled>Next pair →</button></div></div>';
 if(t==="slide") return '<div class="tool"><div class="tt">Model</div><h4>Number slide</h4><p class="note">The decimal point (red dot) stays fixed. Multiply or divide by 10 and watch the digits move. The ones column is shaded.</p><div class="ctrl"><label for="slNum">Start with</label><select id="slNum"><option value="32|-1">0.32</option><option value="125|-1">0.125</option><option value="234|2">234</option><option value="5|-1">0.5</option><option value="429|0">4.29</option></select><button class="btn small" id="slMul">× 10</button><button class="btn small" id="slDiv">÷ 10</button></div><div class="slide"><div class="frame" id="slFrame"></div></div><div class="readout" id="slRead" style="text-align:center"></div></div>';
 return "";
}

/* ES1 covered cards */
function wireCards(){
 var n=0;
 function deal(){
  n=2+Math.floor(Math.random()*12);
  var h=""; for(var i=1;i<=20;i++) h+='<div class="ncard'+(i<=n?" cov":"")+'" aria-label="'+(i<=n?"covered card":"card "+i)+'">'+i+'</div>';
  $("#ncards").innerHTML=h; $("#covAns").value=""; $("#covFb").className="fbline";
 }
 $("#covNew").onclick=deal;
 $("#covCheck").onclick=function(){
  var v=parseInt($("#covAns").value,10), fb=$("#covFb");
  if(isNaN(v)){fb.className="fbline show info";fb.textContent="Type a number first.";return;}
  if(v===n){fb.className="fbline show ok";fb.innerHTML="<b>Yes, "+n+".</b> The first card showing is "+(n+1)+", so 1 to "+n+" must be covered. A student who reasons like this, without counting from one, understands how whole numbers indicate quantity.";
   $$(".ncard.cov").forEach(function(c){c.classList.remove("cov");});}
  else {fb.className="fbline show no";fb.innerHTML="Not quite. Look at the first card you can see. What comes just before it?";}
 };
 deal();
}

/* S1 blocks */
function wireBlocks(){
 var h=3,t=2,o=6;
 function set(nv){h=Math.floor(nv/100);t=Math.floor(nv/10)%10;o=nv%10;draw();}
 function draw(){
  var b="";
  b+='<div class="bgrp">'; for(var i=0;i<h;i++) b+='<div class="hund"></div>'; b+='</div>';
  b+='<div class="bgrp">'; for(i=0;i<t;i++) b+='<div class="ten"></div>'; b+='</div>';
  b+='<div class="bgrp" style="max-width:260px">'; for(i=0;i<o;i++) b+='<div class="one"></div>'; b+='</div>';
  $("#blocks").innerHTML=b;
  var parts=[]; if(h) parts.push(h+" hundred"+(h===1?"":"s")); if(t) parts.push(t+" ten"+(t===1?"":"s")); if(o||!parts.length) parts.push(o+" one"+(o===1?"":"s"));
  var name = parts.length>1 ? parts.slice(0,-1).join(", ")+" and "+parts[parts.length-1] : parts[0];
  $("#blkRead").innerHTML=(h*100+t*10+o)+" is "+name+'<small>'+(h*100+t*10+o)+" = "+[h?h+" × 100":"",t?t+" × 10":"",o?o+" × 1":""].filter(Boolean).join(" + ")+'</small>';
  $("#bH").disabled=h<1; $("#bT").disabled=t<1||o>60; $("#bT2").disabled=t<10; $("#bO2").disabled=o<10;
 }
 $("#blkNum").onchange=function(){set(+this.value);};
 $("#bH").onclick=function(){h--;t+=10;draw();};
 $("#bT").onclick=function(){t--;o+=10;draw();};
 $("#bT2").onclick=function(){t-=10;h++;draw();};
 $("#bO2").onclick=function(){o-=10;t++;draw();};
 draw();
}

/* S2 decimals */
var PAIRS=[
 {a:"0.75",b:"0.8",m:"<b>Longer is larger.</b> Students who think longer decimals are larger choose 0.75. Look at the tenths: 7 tenths is less than 8 tenths."},
 {a:"0.4",b:"0.45",m:"<b>Shorter is larger.</b> This often replaces ‘longer is larger’. 0.45 is 4 tenths and 5 hundredths, a little more than 0.4."},
 {a:"0.3",b:"0.4",m:"<b>Reciprocal or negative thinking.</b> Some students pick 0.3 by analogy with one third and one quarter, or with −3 and −4."},
 {a:"0.5",b:"0.25",m:"<b>Benchmarks.</b> 0.5 is a half and 0.25 is a quarter. Students using whole number thinking may pick 0.25 because 25 is more than 5."},
 {a:"0.7",b:"0.07",m:"<b>Zero in the tenths place.</b> 0.07 is 7 hundredths, ten times smaller than 7 tenths."},
 {a:"0.6",b:"0.60",m:"<b>Trailing zeros.</b> They’re equal: 0.60 is 6 tenths and 0 hundredths, the same as 6 tenths. Students who think a trailing zero makes a decimal bigger choose 0.60."}
];
function wireDecimals(){
 var i=0, score=0, first=true;
 function show(){
  var p=PAIRS[i]; first=true;
  $("#decScore").textContent="Pair "+(i+1)+" of "+PAIRS.length+" · first-try score "+score;
  var eq = +p.a===+p.b;
  $("#decPair").innerHTML='<button class="btn" data-v="a">'+p.a+'</button><button class="btn" data-v="b">'+p.b+'</button>'+(eq?'<button class="btn" data-v="eq" style="background:var(--navy);font-size:16px">They’re equal</button>':'');
  $("#decLine").innerHTML=""; $("#decFb").className="fbline"; $("#decNext").disabled=true;
  $$("#decPair button").forEach(function(b){b.onclick=function(){
   var v=b.dataset.v, A=+p.a, B=+p.b, right = A===B ? "eq" : (A>B?"a":"b");
   if(v===right){ if(first) score++; $("#decFb").className="fbline show ok"; $("#decFb").innerHTML="<b>Correct.</b> "+p.m; }
   else { first=false; $("#decFb").className="fbline show no"; $("#decFb").innerHTML="Not this time. "+p.m; }
   $$("#decPair button").forEach(function(x){x.disabled=true;});
   line(A,B,p.a,p.b); $("#decNext").disabled=false;
   $("#decScore").textContent="Pair "+(i+1)+" of "+PAIRS.length+" · first-try score "+score;
  };});
 }
 function line(A,B,la,lb){
  var x=function(v){return 30+v*640;}, s='<svg viewBox="0 0 700 110" role="img" aria-label="Number line from 0 to 1 showing '+la+' and '+lb+'">';
  s+='<line x1="30" y1="60" x2="670" y2="60" stroke="#1b2333" stroke-width="2"/>';
  for(var k=0;k<=100;k++){var big=k%10===0; s+='<line x1="'+x(k/100)+'" y1="'+(big?50:56)+'" x2="'+x(k/100)+'" y2="'+(big?70:64)+'" stroke="'+(big?"#1b2333":"#b8bfcc")+'" stroke-width="'+(big?1.5:1)+'"/>'; if(big) s+='<text x="'+x(k/100)+'" y="90" text-anchor="middle" font-size="13" fill="#4a5468">'+(k===0?"0":k===100?"1":"0."+(k/10))+'</text>';}
  var same=A===B;
  s+='<circle cx="'+x(A)+'" cy="60" r="7" fill="#c8553d"/><text x="'+x(A)+'" y="'+(same?30:34)+'" text-anchor="middle" font-size="15" font-weight="700" fill="#c8553d">'+la+(same?" = "+lb:"")+'</text>';
  if(!same) s+='<circle cx="'+x(B)+'" cy="60" r="7" fill="#23897d"/><text x="'+x(B)+'" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#23897d">'+lb+'</text>';
  $("#decLine").innerHTML=s+'</svg>';
 }
 $("#decNext").onclick=function(){i=(i+1)%PAIRS.length; if(i===0) score=0; show();};
 show();
}

/* S3 number slide */
function wireSlide(){
 var heads=["thousands","hundreds","tens","ones","tenths","hundredths","thousandths"];
 var D="32", p=-1, W=72, prev="", op="", cur="";
 var fr=$("#slFrame");
 fr.innerHTML=heads.map(function(h){return '<div class="hd">'+h+'</div>';}).join("")+'<div class="cells" id="slCells">'+heads.map(function(h,i){return '<div class="cell'+(i===3?" ones":"")+'" data-c="'+i+'"></div>';}).join("")+'<div class="strip" id="slStrip"></div><div class="pt"></div></div>';
 function colOf(e){return 3-e;}
 function render(anim){
  var strip=$("#slStrip");
  if(!anim) strip.style.transition="none";
  strip.innerHTML=D.split("").map(function(d){return '<span>'+d+'</span>';}).join("");
  strip.style.transform="translateX("+(colOf(p)*W)+"px)";
  if(!anim){ void strip.offsetWidth; strip.style.transition=""; }
  var first=colOf(p), last=colOf(p-D.length+1);
  $$(".cell",fr).forEach(function(c){var i=+c.dataset.c; var needZero = (i>last && i<=3) || (i<first && i>=3); c.textContent=needZero?"0":""; c.style.color=needZero?"#9aa2b1":"";});
  var lastE=p-D.length+1, s="";
  var hiE=Math.max(p,0), loE=Math.min(lastE,0);
  for(var e=hiE;e>=loE;e--){ var idx=p-e; var dg=(idx>=0&&idx<D.length)?D.charAt(idx):"0"; if(e===-1) s+="."; s+=dg; }
  if(loE===0) s=s.replace(/\.$/,"");
  $("#slRead").innerHTML=(op?prev+" "+op+" = ":"")+s+'<small>'+(op?"The digits moved one place; the decimal point stayed where it was.":"Choose × 10 or ÷ 10.")+'</small>';
  cur=s;
  $("#slMul").disabled = p>=3; $("#slDiv").disabled = (p-D.length+1)<=-3;
 }
 $("#slNum").onchange=function(){var v=this.value.split("|"); D=v[0]; p=+v[1]; op=""; render(false);};
 $("#slMul").onclick=function(){prev=cur;op="× 10";p++;render(true);};
 $("#slDiv").onclick=function(){prev=cur;op="÷ 10";p--;render(true);};
 render(false);
}

function wireTool(t){
 if(t==="cards") wireCards();
 if(t==="blocks") wireBlocks();
 if(t==="decimals") wireDecimals();
 if(t==="slide") wireSlide();
}

</script>
<script>
/* Professional learning module engine.
   Shared by every module. Each module page loads, in order:
   content.js (M config + data), tools.js (toolHTML + wireTool), then this file. */
"use strict";
/* ---------------- storage (safe) ---------------- */
var KEY = M.key;
var mem = {done:{}, notes:{}, todo:{}, chk:{}};
try { var raw = window.localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); mem.done = p.done||{}; mem.notes = p.notes||{}; mem.todo = p.todo||{}; mem.chk = p.chk||{}; } } catch(e) {}
function save(){ try { window.localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e) {} }

/* ---------------- sections ---------------- */
var SECTIONS = [
 {id:"welcome",label:"Welcome",grp:"Start here",r:renderWelcome},
 {id:"ideas",label:"The big ideas",grp:"Start here",r:renderIdeas},
 {id:"prog",label:"Progression explorer",grp:"Start here",r:renderProg},
 {id:"wm",label:"Working mathematically",grp:"Start here",r:renderWM},
 {id:"es1",label:"Early Stage 1",grp:"Stage by stage",r:function(){return renderStage("es1");},stage:"es1"},
 {id:"s1",label:"Stage 1",grp:"Stage by stage",r:function(){return renderStage("s1");},stage:"s1"},
 {id:"s2",label:"Stage 2",grp:"Stage by stage",r:function(){return renderStage("s2");},stage:"s2"},
 {id:"s3",label:"Stage 3",grp:"Stage by stage",r:function(){return renderStage("s3");},stage:"s3"},
 {id:"models",label:"Models across K–6",grp:"Pull it together",r:renderModels},
 {id:"sorter",label:"Misconception sorter",grp:"Pull it together",r:renderSorter},
 {id:"reflect",label:"Reflect and plan",grp:"Pull it together",r:renderReflect}
];
var current = 0;

function $(s,el){return (el||document).querySelector(s);}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s));}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function buildNav(){
 var side=$("#side"), h="", g="";
 SECTIONS.forEach(function(s,i){
  if(s.grp!==g){g=s.grp;h+='<div class="grp">'+g+'</div>';}
  var dotStyle = s.stage && !mem.done[s.id] ? ' style="border-color:'+STAGES[s.stage].col+'"' : '';
  h+='<button data-i="'+i+'" class="'+(i===current?"on":"")+'" aria-current="'+(i===current?"page":"false")+'"><span class="dot'+(mem.done[s.id]?" done":"")+'"'+dotStyle+'></span>'+s.label+'</button>';
 });
 side.innerHTML=h;
 $$("button",side).forEach(function(b){b.onclick=function(){go(+b.dataset.i);};});
 var sel=$("#mobSel");
 sel.innerHTML=SECTIONS.map(function(s,i){return '<option value="'+i+'"'+(i===current?" selected":"")+'>'+(mem.done[s.id]?"✓ ":"")+s.label+'</option>';}).join("");
 sel.onchange=function(){go(+sel.value);};
 var n=SECTIONS.filter(function(s){return mem.done[s.id];}).length;
 $("#progTxt").textContent=n+" of "+SECTIONS.length+" sections";
 $("#progFill").style.width=(100*n/SECTIONS.length)+"%";
}

function go(i){
 current=i; buildNav();
 var s=SECTIONS[i], pg=$("#page");
 pg.innerHTML=s.r()+doneBar(s,i);
 wire(s.id);
 var db=$("#doneBtn"); if(db) db.onclick=function(){mem.done[s.id]=!mem.done[s.id];save();go(i);};
 var nx=$("#nextBtn"); if(nx) nx.onclick=function(){if(!mem.done[s.id]){mem.done[s.id]=true;save();} go(i+1);};
 var pv=$("#prevBtn"); if(pv) pv.onclick=function(){go(i-1);};
 try{window.scrollTo(0,0);}catch(e){}
 var m=document.querySelector("main"); if(m) m.scrollTop=0;
}

function doneBar(s,i){
 var d=!!mem.done[s.id];
 return '<div class="done-bar'+(d?" is-done":"")+'"><div><b>'+(d?"Section complete ✓":"Finished this section?")+'</b><div class="note">'+(d?"You can come back at any time.":"Mark it complete to track your progress.")+'</div></div><div class="nextprev">'+
 (i>0?'<button class="btn ghost" id="prevBtn">← Back</button>':'')+
 '<button class="btn ghost" id="doneBtn">'+(d?"Mark as not done":"Mark complete")+'</button>'+
 (i<SECTIONS.length-1?'<button class="btn" id="nextBtn">Next: '+SECTIONS[i+1].label+' →</button>':'')+'</div></div>';
}

/* ---------------- renderers ---------------- */
function renderWelcome(){
 var rows=ORDER.map(function(k){var S=STAGES[k],C=STAGE_CONTENT[k];return '<tr><td><span class="pill" style="background:'+S.col+';color:#fff;border-color:'+S.col+'">'+S.name+'</span><div class="note" style="margin-top:4px">'+S.years+'</div></td><td>'+S.fa+'</td><td>'+C.outcomes.map(function(o){return o[0];}).join(", ")+'</td></tr>';}).join("");
 return '<div class="hero" style="border-left-color:var(--accent)"><span class="tag" style="background:var(--accent-soft);color:var(--accent)">Welcome</span><h2>'+M.welcomeH2+'</h2><p>'+M.welcomeP+'</p></div>'+
 '<section class="blk"><h3>What you’ll do</h3><div class="grid3">'+
 card("Explore","the six big ideas and how each one grows from Kindergarten to Year 6.")+
 card("Diagnose","misconceptions with flip cards, short quizzes and a misconception sorter.")+
 card("Rework","closed tasks into rich ones that embed Working mathematically, with one makeover for each stage.")+
 card("Try",M.tryText)+
 card("Reflect","on your own students and plan next steps. Your notes save in this browser.")+
 '</div></section>'+
 '<section class="blk"><h3>'+M.namesH3+'</h3><p class="lead">'+M.namesP+'</p><table class="simple"><thead><tr><th>Stage</th><th>Focus area name</th><th>Outcomes</th></tr></thead><tbody>'+rows+'</tbody></table></section>'+
 '<section class="blk"><h3>Suggested pathways</h3><div class="grid2"><div class="card"><h4 style="margin-bottom:6px">On your own (about 45 minutes)</h4><ul class="tight"><li>Big ideas and the progression explorer</li><li>Your stage, plus the stage before it</li><li>The misconception sorter</li><li>Reflect and plan</li></ul></div><div class="card"><h4 style="margin-bottom:6px">As a staff or PLC session (about 60 minutes)</h4><ul class="tight"><li>Whole staff: big ideas and progression (15 min)</li><li>Stage teams: their stage section and tool (25 min)</li><li>Whole staff: misconception sorter (10 min)</li><li>Reflection prompts and next steps (10 min)</li></ul></div></div><p class="note" style="margin-top:12px">Tip: most difficulties in a stage begin in the stage before it, so look one stage back as well as at your own.</p></section>'+
 checkHTML("pre");
}
function card(t,d){return '<div class="card"><b>'+t+'</b> <span style="color:var(--ink2)">'+d+'</span></div>';}

function renderIdeas(){
 return '<div class="hero"><span class="tag" style="background:var(--accent-soft);color:var(--accent)">Big ideas</span><h2>Six ideas run from K to 6</h2><p>'+M.ideasP+'</p></div>'+
 '<div class="ideas">'+IDEAS.map(function(d,i){return '<button class="idea" data-i="'+i+'"><div class="num">'+(i+1)+'</div><h4>'+d.t+'</h4><p>'+d.d+'</p></button>';}).join("")+'</div>'+
 '<div class="ideadetail card" id="ideaDetail"><p class="note" style="margin:0">Select an idea above to see what it looks like at each stage.</p></div>'+

}
function showIdea(i){

}

function renderProg(){
 return '<div class="hero"><span class="tag" style="background:var(--accent-soft);color:var(--accent)">Progression</span><h2>How the focus area grows</h2><p>'+M.progP+'</p></div>'+
 '<div class="aspects" role="tablist">'+ASPECTS.map(function(a,i){return '<button role="tab" data-k="'+i+'" class="'+(i===0?"on":"")+'">'+a.l+'</button>';}).join("")+'</div>'+
 '<div class="pcols" id="pcols"></div>'+
 '<section class="blk"><h3>What changes between stages</h3><div class="shifts">'+
 M.shifts.map(function(x){return '<div class="shift"><div class="arr" style="color:'+STAGES[x[0]].col+'">'+x[1]+'</div>'+x[2]+'</div>';}).join("")+
 '</div></section>';

 $("#pcols").innerHTML=ORDER.map(function(k){var S=STAGES[k];return '<div class="pcol"><div class="ph" style="background:'+S.col+'">'+S.name+'<small>'+S.years+'</small></div><div class="pb">'+a.v[k]+'</div></div>';}).join("");

function renderStage(k){
 var S=STAGES[k], C=STAGE_CONTENT[k];
 var h='<div class="hero" style="border-left-color:'+S.col+'"><span class="tag" style="background:'+S.soft+';color:'+S.col+'">'+S.name+' · '+S.years+'</span><h2>'+S.fa+'</h2><p>'+C.lead+'</p></div>';

 var st=SECTIONS.filter(function(s){return s.id===id;})[0];
 if(st && st.stage){
  var C=STAGE_CONTENT[st.stage];
  $$(".acc>button").forEach(function(b){b.onclick=function(){var a=b.parentNode;a.classList.toggle("open");b.setAttribute("aria-expanded",a.classList.contains("open"));};});
  $$(".flip").forEach(function(f){f.onclick=function(){f.classList.toggle("on");f.setAttribute("aria-pressed",f.classList.contains("on"));};});
  $$(".quiz .q").forEach(function(qd){
   var q=C.quiz[+qd.dataset.q], fb=$(".fb",qd);
   $$(".opt",qd).forEach(function(b){b.onclick=function(){
    var o=+b.dataset.o;
    if(o===q.a){ b.classList.add("right"); $$(".opt",qd).forEach(function(x){x.disabled=true;}); fb.className="fb show ok"; fb.innerHTML="<b>Correct.</b> "+q.why; }
    else { b.classList.add("wrong"); b.disabled=true; fb.className="fb show no"; fb.innerHTML="Not quite. Have another go."; }
   };});
  });
  wireMakeover(st.stage);
  if(typeof wireTool==="function") wireTool(C.tool);
 }
}

/* makeover reveal */
function wireMakeover(k){
 var box=$("#mkAfter"), key="mk-"+k;
 function closed(){
  box.innerHTML='<div class="hidden-after"><div class="think">How would you rework this task?<textarea id="mkIdea" placeholder="My idea…"></textarea></div><button class="btn" id="mkReveal" style="background:var(--good)">Reveal the makeover</button></div>';
  var ta=$("#mkIdea"); ta.value=mem.notes[key]||""; ta.oninput=function(){mem.notes[key]=ta.value;save();};
  $("#mkReveal").onclick=open;
 }
 function open(){ box.innerHTML=afterHTML(k)+(mem.notes[key]?'<div class="note" style="margin-top:10px"><b>Your idea:</b> '+esc(mem.notes[key])+'</div>':''); $("#mkHide").onclick=closed; }
 closed();
}

document.getElementById("foot").innerHTML=M.footer;
go(0);

</script>
